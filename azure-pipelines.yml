# Node.js with React
# Build a Node.js project that uses React.
# Updated to Node.js 22.x for TypeScript 5.x and modern dependency compatibility
# Add steps that analyze code, save build artifacts, deploy, and more:
# https://docs.microsoft.com/azure/devops/pipelines/languages/javascript

trigger:
- master

parameters:
- name: enableStagingBlogMetadata
  displayName: 'Enable on-demand blog metadata in staging (requires Node 22 and iisnode)'
  type: boolean
  default: false
- name: enableProductionBlogMetadata
  displayName: 'Enable on-demand blog metadata in production (requires staging and production approval)'
  type: boolean
  default: false

pool:
  vmImage: 'ubuntu-latest'

variables:
  stageBuildConfiguration: '$(StageBuildConfig)'
  productionBuildConfiguration: '$(ProductionBuildConfig)'

jobs:
- job: Build
  displayName: 'Shipping happiness to the world!'  # Updated description
  steps:
  - ${{ if and(eq(parameters.enableProductionBlogMetadata, true), ne(parameters.enableStagingBlogMetadata, true)) }}:
    - script: |
        echo "Production metadata requires enableStagingBlogMetadata=true so this release exercises the same handler in staging first." >&2
        exit 1
      displayName: 'Reject production metadata without staging metadata'

  - script: |
      echo "Nuevo Foundation"
      echo "                                            @@@%%%%%%%%@@@                                          "
      echo "                                          @%*:..........:*@@                                        "
      echo "                                        @%-..            ..-%@                                      "
      echo "                                       @%++++++++++++++:.   .*@                                     "
      echo "                        @@@@@@@@@@@@@@@#===============-:::::-%@@@@@@@@@@@@                         "
      echo "                       %#-------------------------------------------------#@                       "
      echo "                       %+                                                .*@                        "
      echo "                       %+                                                .*@                        "
      echo "                       %+ .:------------------------------------------:. .*@                        "
      echo "                      @%+ :%@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@%- .*@@                       "
      echo "                    @%**+ :%@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@%- .*-=#%                     "
      echo "                   @%:.++ :%@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@%- .*=#:=%                    "
      echo "                   @-.=++ :%@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@%- .*=#:.-@                   "
      echo "                  @%.:#++ :%@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@%- .*=#:..%@                  "
      echo "                   @.:#++ :%@@@@@%%@@@@@@@@@@@@@@@@@@@@@@@@@@@@%#@@@@@%- .*=#:..%                   "
      echo "                   @*:#++ :%@@@@#==+@@@@@@@@@@@@@@@@@@@@@@@@@@%==+@@@@%- .*=#:.#@                   "
      echo "                    @##++ :%@@@@*===%@@@@@@@@@@@@@@@@@@@@@@@@@*==+%@@@%- .*=#+#@                    "
      echo "                     @%#+ :%@@@@#===%@@@@@@@@@@@@@@@@@@@@@@@@@#==+@@@@%- .*#%@@                     "
      echo "                       %+ :%@@@@@#*%@@@@@@@@@@@@@@@@@@@@@@@@@@@#*%@@@@%- .*@                         "
      echo "                       %+ :%@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@%- .*@                         "
      echo "                       %+ .+##########################################+: .*@                         "
      echo "                       %+.................................................*@                         "
      echo "                       @@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@                         "
    displayName: 'Nuvi enters the chat'

  - script: |
      version=$(cat .node-version)
      if ! [[ "$version" =~ ^[0-9]+$ ]]; then
        echo "Invalid .node-version: expected a Node.js major version." >&2
        exit 1
      fi
      echo "##vso[task.setvariable variable=nodeVersion]$version"
    displayName: 'Read project Node version'

  - task: UseNode@1
    inputs:
      version: '$(nodeVersion)'
      checkLatest: true
    displayName: 'Install Node.js'

  - script: |
      npm ci --legacy-peer-deps
    displayName: 'npm ci (clean install)'

  #- script : | 
  #    ./node_modules/.bin/eslint src/**/*.{ts,tsx}
  #  displayName: 'run eslint'

  - script: |
      npm run test-ci
    displayName: 'npm run test-ci'

  - script: |
      npm run "$(stageBuildConfiguration)"
    displayName: 'npm run $(stageBuildConfiguration) - staging build'

  - ${{ if eq(parameters.enableStagingBlogMetadata, true) }}:
    - script: npm run runtime:enable-staging
      displayName: 'Select blog metadata runtime for staging artifact only'

  - task: CopyFiles@2
    displayName: 'Copy Files to: $(Build.ArtifactStagingDirectory)'
    inputs:
      contents: '**/build/**'
      targetFolder: $(Build.ArtifactStagingDirectory)
      cleanTargetFolder: true 
      overWrite: true 
    condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/master'))  

  - task: PublishBuildArtifacts@1
    displayName: 'Publish src to: $(Build.ArtifactStagingDirectory)'
    inputs:
      pathtoPublish: '$(Build.ArtifactStagingDirectory)' 
      artifactName: 'stage' 
    condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/master'))  

  - script: |
      npm run "$(productionBuildConfiguration)"
    displayName: 'npm run $(productionBuildConfiguration) - production build'

  - ${{ if eq(parameters.enableProductionBlogMetadata, true) }}:
    - script: npm run runtime:enable-production
      displayName: 'Select blog metadata runtime for production artifact only'

  - task: CopyFiles@2
    displayName: 'Copy Files to: $(Build.ArtifactStagingDirectory)'
    inputs:
      contents: '**/build/**'
      targetFolder: $(Build.ArtifactStagingDirectory)
      cleanTargetFolder: true 
      overWrite: true
    condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/master'))  

  - task: PublishBuildArtifacts@1
    displayName: 'Publish src to: $(Build.ArtifactStagingDirectory)'
    inputs:
      pathtoPublish: '$(Build.ArtifactStagingDirectory)' 
      artifactName: 'production' 
    condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/master'))  
